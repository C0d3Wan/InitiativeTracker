name: Package Native Executables

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger the workflow from GitHub

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Job 1: Build Windows .exe on a Windows machine
          - os: windows-latest
            package-type: app-image
            executable-ext: exe
          # Job 2: Build Linux bundle on a Linux machine
          - os: ubuntu-latest
            package-type: app-image
            executable-ext: bin

    steps:
      # 1. Checkout repository source code
      - name: Checkout Code
        uses: actions/checkout@v7

      # 2. Set up JDK (jpackage requires JDK 14+)
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build & Package using Maven + jpackage
      - name: Build Application with Maven
        run: mvn clean package

      # 4. Upload the built native package as a downloadable artifact
      - name: Upload Native Output
        uses: actions/upload-artifact@v7
        with:
          name: MyApp-${{ runner.os }}
          path: target/dist/
