name: Package Native Executables

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Job 1: Build Windows .exe on a Windows machine
          - os: windows-latest
            package-type: app-image
            executable-ext: exe
          # Job 2: Build Linux bundle on a Linux machine
          - os: ubuntu-latest
            package-type: app-image
            executable-ext: bin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Application with Maven
        run: mvn clean package

      - name: Upload Native Output
        uses: actions/upload-artifact@v7
        with:
          name: MyApp-${{ runner.os }}
          path: target/dist/
