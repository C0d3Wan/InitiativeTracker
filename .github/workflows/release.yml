name: Build Installers
on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Build jar
        run: mvn clean package

      - name: Create deb package
        run: |
          jpackage \
            --type deb \
            --input target \
            --main-jar InitiativeTracker.jar \
            --name InitiativeTracker \
            --icon packaging/icon.png

      - name: Create App Image Directory
        run: |
          jpackage \
            --type app-image \
            --input target \
            --main-jar InitiativeTracker.jar \
            --name InitiativeTracker

      - name: Add Desktop File
        run: |
          cp packaging/InitiativeTracker.desktop InitiativeTracker/

      - name: Add Icon
        run: |
          cp packaging/InitiativeTracker.png InitiativeTracker/

      - name: Download linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create AppRun
        run: |
          cat > InitiativeTracker/AppRun << 'EOF'
          #!/bin/sh
          exec "$APPDIR/bin/InitiativeTracker" "$@"
          EOF

          chmod +x InitiativeTracker/AppRun

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
          --appdir InitiativeTracker \
          --desktop-file InitiativeTracker/InitiativeTracker.desktop \
          --icon-file InitiativeTracker/InitiativeTracker.png \
          --output appimage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            *.deb
            InitiativeTracker*.AppImage

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Build jar
        run: mvn clean package

      - name: Create EXE
        run: |
          jpackage `
            --type exe `
            --input target `
            --main-jar InitiativeTracker.jar `
            --name InitiativeTracker `
            --icon packaging/icon.ico `
            --win-menu

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: "*.exe"

  release:
    needs:
      - build-linux
      - build-windows

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Linux Packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: release

      - name: Download Windows Installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.deb
            release/*.AppImage